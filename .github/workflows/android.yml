name: Android CI

# Compila la app y corre las pruebas unitarias en cada push y pull request.
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # El repo no incluye gradlew: se usa la misma versión que declara gradle-wrapper.properties.
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Pruebas unitarias
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Compilar APK debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Subir reporte de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
